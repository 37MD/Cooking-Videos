<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cooking Videos 1A</title>
<meta name="theme-color" content="#c8a97e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cooking Videos 1A">
<meta name="application-name" content="Cooking Videos 1A">
<meta name="description" content="Cooking YouTube channels & short film series — ad-free video hub">
<link rel="manifest" href="#" id="pwa-manifest-link">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='28' fill='%23b8925f'/%3E%3Ccircle cx='96' cy='96' r='55' fill='none' stroke='%231a1a1a' stroke-width='6'/%3E%3Cpolygon points='80,72 80,120 128,96' fill='%231a1a1a'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='28' fill='%23b8925f'/%3E%3Ccircle cx='96' cy='96' r='55' fill='none' stroke='%231a1a1a' stroke-width='6'/%3E%3Cpolygon points='80,72 80,120 128,96' fill='%231a1a1a'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@700;900&family=DM+Serif+Display&family=Noto+Sans+Devanagari:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #c8a97e;
  --surface:   #b8925f;
  --card:      #d4b896;
  --accent:    #1a1a1a;
  --series-hl: #2c4a2e;
  --videos-hl: #1a2e4a;
  --wl-hl:     #6b2d00;
  --text:      #0d0d0d;
  --muted:     #4a3828;
  --border:    #9e7a52;
  --light:     #e8d5b8;
  --lighter:   #f0e6d0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  background-image:
    repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(0,0,0,0.016) 3px, rgba(0,0,0,0.016) 4px),
    repeating-linear-gradient(0deg,  transparent, transparent 3px, rgba(0,0,0,0.016) 3px, rgba(0,0,0,0.016) 4px);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}
/* ── HEADER ── */
.app-header {
  background: var(--surface);
  border-bottom: 3px solid var(--accent);
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 3px 14px rgba(0,0,0,0.22);
}
.header-top {
  display: flex; align-items: center;
  padding: 13px 16px 9px; gap: 12px;
}
.play-icon { width: 36px; height: 36px; flex-shrink: 0; }
.app-title-wrap { flex: 1; }
.app-title {
  font-family: 'DM Serif Display', serif;
  font-size: 25px; letter-spacing: .5px; color: var(--text); line-height: 1;
}
.app-subtitle {
  font-size: 9px; letter-spacing: .18em; text-transform: uppercase;
  color: var(--muted); margin-top: 3px; font-weight: 700;
}
/* ── TABS ── */
.tab-bar { display: flex; border-top: 1px solid rgba(0,0,0,0.18); }
.tab-btn {
  flex: 1; padding: 10px 4px;
  background: transparent; border: none;
  color: var(--muted); font-family: 'DM Sans',sans-serif;
  font-size: 9px; font-weight: 900; text-transform: uppercase;
  letter-spacing: .1em; cursor: pointer; position: relative;
  transition: color .2s, background .2s; line-height: 1.5; text-align: center;
}
.tab-btn.active { background: rgba(0,0,0,0.07); }
.tab-btn.active::after {
  content:''; position:absolute; bottom:0; left:10%; width:80%; height:3px;
  border-radius:2px 2px 0 0;
}
.tab-btn.tab-series.active { color: var(--series-hl); }
.tab-btn.tab-series.active::after { background: var(--series-hl); }
.tab-btn.tab-videos.active { color: var(--videos-hl); }
.tab-btn.tab-videos.active::after { background: var(--videos-hl); }
.tab-btn.tab-watchlater.active { color: var(--wl-hl); }
.tab-btn.tab-watchlater.active::after { background: var(--wl-hl); }
.tab-icon { font-size: 15px; display: block; margin-bottom: 2px; }
.wl-count {
  display: inline-block; background: var(--wl-hl); color: #fff;
  font-size: 8px; font-weight: 900; min-width: 16px; height: 16px;
  line-height: 16px; border-radius: 8px; padding: 0 4px;
  vertical-align: middle; margin-left: 3px;
}
/* ── MAIN ── */
.app-body { max-width: 960px; margin: 0 auto; padding-bottom: 80px; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }
/* ── BANNERS ── */
.section-banner {
  padding: 14px 16px 10px; border-bottom: 2px solid rgba(0,0,0,0.14);
  display: flex; align-items: center; gap: 10px;
  background: rgba(0,0,0,0.07);
}
.banner-title {
  font-family: 'DM Serif Display',serif; font-size: 21px; letter-spacing:.3px;
}
.banner-title.s { color: var(--series-hl); }
.banner-title.v { color: var(--videos-hl); }
.banner-title.w { color: var(--wl-hl); }
.banner-sub {
  font-size: 9px; color: var(--muted); text-transform: uppercase;
  letter-spacing: .1em; margin-top: 2px; font-weight: 700;
}
.banner-count {
  margin-left: auto; font-size: 9px; color: var(--muted);
  text-transform: uppercase; letter-spacing: .1em; font-weight: 700;
}
/* ── CHANNEL GROUPS ── */
.channel-group { border-bottom: 1px solid rgba(0,0,0,0.11); }
.ch-header {
  display: flex; align-items: center; padding: 11px 16px;
  cursor: pointer; user-select: none; gap: 10px; transition: background .15s;
}
.ch-header:hover { background: rgba(0,0,0,0.06); }
.ch-badge {
  font-size: 8px; font-weight: 900; text-transform: uppercase;
  padding: 3px 8px; border-radius: 2px; letter-spacing: .1em; flex-shrink: 0;
}
.badge-s  { background: rgba(44,74,46,.12); color: var(--series-hl); border: 1px solid var(--series-hl); }
.badge-v  { background: rgba(26,46,74,.12); color: var(--videos-hl); border: 1px solid var(--videos-hl); }
.badge-mr { background: rgba(0,0,0,.07);    color: var(--text);       border: 1px solid var(--border); }
.ch-name  { font-size: 13px; font-weight: 900; flex:1; color: var(--text); }
.ch-lang  { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing:.06em; font-weight:700; }
.ch-arrow { color: var(--muted); font-size: 10px; transition: transform .25s; }
.channel-group.open .ch-arrow { transform: rotate(180deg); }
/* ── FEED GRID ── */
.feed-grid {
  display: none; padding: 0 10px 10px;
  flex-direction: column; background: rgba(0,0,0,0.04);
}
.channel-group.open .feed-grid { display: flex; }
/* ── FEED ITEM ── */
.feed-item {
  padding: 10px 6px; border-bottom: 1px solid rgba(0,0,0,0.07);
  display: flex; align-items: flex-start; gap: 10px;
  cursor: pointer; transition: background .15s; border-radius: 3px;
}
.feed-item:last-of-type { border-bottom: none; }
.feed-item:hover { background: rgba(0,0,0,0.05); }
.item-thumb {
  width: 100px; height: 56px; object-fit: cover; flex-shrink: 0;
  border-radius: 3px; border: 1px solid rgba(0,0,0,0.18); background: var(--card);
}
.item-info { flex:1; min-width:0; }
.item-title {
  font-size: 12px; font-weight: 700; line-height: 1.45;
  color: var(--text);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.item-date {
  font-size: 9px; color: var(--muted); margin-top: 4px;
  letter-spacing: .07em; text-transform: uppercase; font-weight: 700;
}
.item-actions {
  display: flex; flex-direction: column; gap: 5px; align-items: center; flex-shrink: 0;
}
.btn-play {
  width: 28px; height: 28px; background: var(--accent); color: #fff;
  border: none; border-radius: 50%; display: flex; align-items: center;
  justify-content: center; cursor: pointer; font-size: 9px;
  transition: transform .15s, opacity .15s;
}
.btn-play:hover { transform: scale(1.1); opacity:.85; }
.btn-wl {
  width: 28px; height: 28px; background: var(--lighter); color: var(--wl-hl);
  border: 1px solid var(--wl-hl); border-radius: 50%; display: flex; align-items: center;
  justify-content: center; cursor: pointer; font-size: 12px;
  transition: background .15s;
}
.btn-wl:hover { background: #ffe0c8; }
.btn-wl.saved { background: var(--wl-hl); color: #fff; }
/* ── LOADING / ERROR ── */
.loading-row {
  padding: 18px 16px; text-align: center; font-size: 10px;
  color: var(--muted); letter-spacing: .1em; text-transform: uppercase; font-weight: 700;
}
.spin { display: inline-block; animation: spin .8s linear infinite; margin-right: 5px; }
@keyframes spin { to { transform: rotate(360deg); } }
.error-row {
  padding: 12px 16px; font-size: 10px; color: #7a2020;
  text-align: center; letter-spacing: .08em; font-weight: 700;
}
/* ── SERIES FETCH TOOL ── */
.series-tool {
  margin: 14px 12px; border: 2px solid var(--accent);
  border-radius: 3px; overflow: hidden; background: rgba(0,0,0,0.04);
}
.series-tool-hdr {
  background: var(--accent); padding: 9px 14px;
  font-size: 10px; font-weight: 900; text-transform: uppercase;
  letter-spacing: .13em; color: #fff;
}
.series-tool-body { padding: 12px; }
.stool-input {
  width: 100%; padding: 9px 11px; background: var(--lighter);
  border: 1px solid var(--border); color: var(--text);
  font-family: 'DM Sans',sans-serif; font-size: 12px; font-weight: 700;
  border-radius: 3px; margin-bottom: 9px; outline: none; transition: border-color .2s;
}
.stool-input:focus { border-color: var(--accent); }
.stool-input::placeholder { color: var(--muted); font-weight: 400; }
.stool-btn {
  width: 100%; padding: 10px; background: var(--accent); color: #fff; border: none;
  border-radius: 3px; font-family: 'DM Sans',sans-serif; font-size: 11px;
  font-weight: 900; text-transform: uppercase; letter-spacing: .11em; cursor: pointer;
}
.stool-btn:hover { opacity: .87; }
.series-results { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 12px; }
/* ── WATCH LATER TAB ── */
.wl-empty {
  text-align: center; padding: 50px 20px;
  font-size: 13px; color: var(--muted); font-weight: 700;
}
.wl-empty-icon { font-size: 40px; display: block; margin-bottom: 12px; }
.wl-item {
  padding: 12px 14px; border-bottom: 1px solid rgba(0,0,0,0.1);
  display: flex; align-items: flex-start; gap: 10px;
}
.wl-item:hover { background: rgba(0,0,0,0.04); }
.wl-thumb {
  width: 96px; height: 54px; object-fit: cover; flex-shrink: 0;
  border-radius: 3px; border: 1px solid rgba(0,0,0,0.18); background: var(--card);
}
.wl-info { flex:1; min-width:0; }
.wl-title { font-size: 12px; font-weight: 700; line-height: 1.45; color: var(--text);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.wl-meta  { font-size: 9px; color: var(--muted); margin-top: 4px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.wl-actions { display: flex; flex-direction: column; gap: 5px; flex-shrink:0; }
.btn-wl-play {
  width: 28px; height: 28px; background: var(--accent); color: #fff; border: none;
  border-radius: 50%; cursor: pointer; font-size: 9px; display: flex;
  align-items: center; justify-content: center; transition: opacity .15s;
}
.btn-wl-play:hover { opacity:.85; }
.btn-wl-remove {
  width: 28px; height: 28px; background: var(--lighter); color: #7a2020;
  border: 1px solid #7a2020; border-radius: 50%; cursor: pointer; font-size: 11px;
  display: flex; align-items: center; justify-content: center; transition: background .15s;
}
.btn-wl-remove:hover { background: #ffe0d0; }
.wl-clear-row {
  padding: 12px 14px; border-top: 2px solid rgba(0,0,0,0.12); text-align: right;
}
.btn-clear-all {
  background: none; border: 2px solid #7a2020; color: #7a2020;
  font-family: 'DM Sans',sans-serif; font-size: 10px; font-weight: 900;
  text-transform: uppercase; letter-spacing: .1em; padding: 6px 14px;
  cursor: pointer; border-radius: 3px;
}
.btn-clear-all:hover { background: #ffe0d0; }
/* ── LOAD MORE ── */
.load-more-wrap { text-align: center; padding: 14px; }
.btn-load-more {
  background: var(--lighter); border: 2px solid var(--accent); color: var(--text);
  font-family: 'DM Sans',sans-serif; font-size: 10px; font-weight: 900;
  text-transform: uppercase; letter-spacing: .1em; padding: 8px 20px;
  cursor: pointer; border-radius: 3px; transition: background .2s;
}
.btn-load-more:hover { background: var(--card); }
/* ── PLAYER OVERLAY ── */
#player-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.9);
  z-index: 500; display: none; flex-direction: column;
}
#player-overlay.active { display: flex; }
.player-topbar {
  display: flex; align-items: center; padding: 11px 14px;
  background: var(--surface); border-bottom: 3px solid var(--accent);
  gap: 10px; flex-shrink: 0;
}
.btn-close {
  background: var(--accent); border: none; color: #fff; padding: 7px 14px;
  font-family: 'DM Sans',sans-serif; font-size: 11px; font-weight: 900;
  cursor: pointer; border-radius: 3px; text-transform: uppercase;
  letter-spacing: .06em; flex-shrink: 0;
}
.player-ttl {
  font-size: 11px; font-weight: 700; flex:1; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; color: var(--text);
}
.btn-wl-player {
  background: var(--lighter); border: 2px solid var(--wl-hl); color: var(--wl-hl);
  font-family: 'DM Sans',sans-serif; font-size: 9px; font-weight: 900;
  padding: 6px 10px; cursor: pointer; border-radius: 3px; flex-shrink: 0;
  text-transform: uppercase; letter-spacing: .08em; transition: background .15s;
  white-space: nowrap;
}
.btn-wl-player:hover { background: #ffe0c8; }
.btn-wl-player.saved { background: var(--wl-hl); color: #fff; border-color: var(--wl-hl); }
.btn-yt-open {
  background: var(--lighter); border: 1px solid var(--border); color: var(--text);
  font-family: 'DM Sans',sans-serif; font-size: 9px; font-weight: 700;
  padding: 6px 10px; cursor: pointer; border-radius: 3px; text-decoration: none;
  display: inline-flex; align-items: center; gap: 3px; flex-shrink: 0;
  text-transform: uppercase; letter-spacing: .07em;
}
.player-wrap {
  position: relative; width: 100%; padding-bottom: 56.25%;
  background: #000; flex-shrink: 0;
}
.player-iframe {
  position: absolute; inset: 0; width: 100%; height: 100%; border: none;
}
.player-info {
  padding: 14px 16px; overflow-y: auto; flex:1; background: var(--surface);
}
.player-info-title {
  font-family: 'DM Serif Display',serif; font-size: 18px; line-height: 1.35;
  color: var(--text); margin-bottom: 6px;
}
.player-info-meta {
  font-size: 9px; color: var(--muted); text-transform: uppercase;
  letter-spacing: .11em; font-weight: 700;
}
/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }
/* ── INSTALL BADGE ── */
#pwa-badge {
  position: fixed; bottom: 20px; left: 16px; z-index: 1300;
  background: var(--accent); color: #fff; font-family: 'DM Sans',sans-serif;
  font-size: 10px; font-weight: 900; padding: 9px 18px; border-radius: 20px;
  cursor: pointer; box-shadow: 0 4px 18px rgba(0,0,0,0.3); display: none;
  letter-spacing: .1em; text-transform: uppercase;
}
.thumb-placeholder {
  width: 100px; height: 56px; flex-shrink: 0; border-radius: 3px;
  border: 1px solid rgba(0,0,0,0.18); background: var(--card);
  display: flex; align-items: center; justify-content: center;
  color: var(--muted); font-size: 18px;
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="app-header">
  <div class="header-top">
    <svg class="play-icon" viewBox="0 0 36 36" fill="none">
      <circle cx="18" cy="18" r="17" fill="rgba(0,0,0,0.1)"/>
      <circle cx="18" cy="18" r="17" stroke="#1a1a1a" stroke-width="2"/>
      <polygon points="14,11 14,25 27,18" fill="#1a1a1a"/>
    </svg>
    <div class="app-title-wrap">
      <div class="app-title">Cooking Videos 1A</div>
      <div class="app-subtitle">YouTube Series &amp; Cooking Channels · Ad-Free</div>
    </div>
  </div>
  <div class="tab-bar">
    <button class="tab-btn tab-series active" onclick="switchTab('series')">
      <span class="tab-icon">🎬</span>YouTube Series
    </button>
    <button class="tab-btn tab-videos" onclick="switchTab('videos')">
      <span class="tab-icon">🍳</span>Cooking Videos
    </button>
    <button class="tab-btn tab-watchlater" onclick="switchTab('watchlater')">
      <span class="tab-icon">🕐</span>Watch Later<span class="wl-count" id="wl-count" style="display:none">0</span>
    </button>
  </div>
</div>

<!-- BODY -->
<div class="app-body">

  <!-- TAB: SERIES -->
  <div id="panel-series" class="tab-panel active">
    <div class="section-banner">
      <span style="font-size:20px">🎬</span>
      <div>
        <div class="banner-title s">YouTube Series</div>
        <div class="banner-sub">Short Films · Drama · Comedy</div>
      </div>
      <div class="banner-count">20 Channels</div>
    </div>
    <div class="series-tool">
      <div class="series-tool-hdr">🔍 Fetch Any Playlist / Channel Episodes</div>
      <div class="series-tool-body">
        <input class="stool-input" id="series-input"
          placeholder="Paste YouTube Playlist or Channel URL (list=…)"
          onkeydown="if(event.key==='Enter') fetchSeries()">
        <button class="stool-btn" onclick="fetchSeries()">▶ Fetch Episodes</button>
        <div id="series-results" class="series-results" style="display:none"></div>
      </div>
    </div>
    <div id="series-channels"></div>
  </div>

  <!-- TAB: VIDEOS -->
  <div id="panel-videos" class="tab-panel">
    <div class="section-banner">
      <span style="font-size:20px">🍳</span>
      <div>
        <div class="banner-title v">Cooking Videos</div>
        <div class="banner-sub">Recipes · Kitchen Channels</div>
      </div>
      <div class="banner-count">20 Channels</div>
    </div>
    <div id="video-channels"></div>
  </div>

  <!-- TAB: WATCH LATER -->
  <div id="panel-watchlater" class="tab-panel">
    <div class="section-banner">
      <span style="font-size:20px">🕐</span>
      <div>
        <div class="banner-title w">Watch Later</div>
        <div class="banner-sub">Your saved videos</div>
      </div>
      <div class="banner-count" id="wl-banner-count">0 videos</div>
    </div>
    <div id="wl-list"></div>
  </div>

</div>

<!-- PLAYER OVERLAY -->
<div id="player-overlay">
  <div class="player-topbar">
    <button class="btn-close" onclick="closePlayer()">✕ Close</button>
    <span class="player-ttl" id="p-title">Loading…</span>
    <button class="btn-wl-player" id="p-wl-btn" onclick="toggleWLFromPlayer()">+ Watch Later</button>
    <a class="btn-yt-open" id="p-yt-link" href="#" target="_blank" rel="noopener noreferrer">↗ YouTube</a>
  </div>
  <div class="player-wrap">
    <iframe class="player-iframe" id="player-iframe"
      allow="autoplay; fullscreen; encrypted-media"
      allowfullscreen></iframe>
  </div>
  <div class="player-info">
    <div class="player-info-title" id="p-info-title"></div>
    <div class="player-info-meta" id="p-info-meta"></div>
  </div>
</div>

<!-- INSTALL -->
<div id="pwa-badge" onclick="triggerInstall()">⬇ Install App</div>

<script>

/* =====================================================================

var SERIES = [

/* =====================================================================
   PROXY CONFIG — rss2json primary, allorigins fallback (parses raw XML)
   Both work in real browsers; server-side testing blocks them (cloud IP)
   ===================================================================== */
var PRIMARY_PROXY  = 'https://api.rss2json.com/v1/api.json?rss_url=';
var FALLBACK_PROXY = 'https://api.allorigins.win/get?url=';

var BATCH = 8;
var loadedFeeds = {};

/* =====================================================================
   HELPERS
   ===================================================================== */
function getVid(url) {
  if (!url) return null;
  var m = url.match(/[?&]v=([A-Za-z0-9_-]{11})/) || url.match(/youtu\.be\/([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}
function thumbUrl(vid) {
  return vid ? 'https://img.youtube.com/vi/' + vid + '/mqdefault.jpg' : null;
}
function embedUrl(vid) {
  // No ads params: rel=0 hides related, modestbranding removes logo, iv_load_policy=3 hides annotations
  return 'https://www.youtube.com/embed/' + vid
    + '?autoplay=1&rel=0&modestbranding=1&iv_load_policy=3&showinfo=0&fs=1';
}
function fmtDate(s) {
  try {
    return new Date(s).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
  } catch(e) { return ''; }
}
function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function parseXMLItems(xmlText) {
  // Parse raw YouTube Atom XML without DOM to extract video entries
  var items = [];
  var entryRegex = /<entry>([\s\S]*?)<\/entry>/g;
  var m;
  while ((m = entryRegex.exec(xmlText)) !== null) {
    var block = m[1];
    var vidMatch   = block.match(/<yt:videoId>([^<]+)<\/yt:videoId>/);
    var titleMatch = block.match(/<title>([^<]*)<\/title>/);
    var pubMatch   = block.match(/<published>([^<]+)<\/published>/);
    var thumbMatch = block.match(/url="(https:\/\/i[^"]+)"/);
    if (vidMatch) {
      var vid = vidMatch[1].trim();
      items.push({
        link:     'https://www.youtube.com/watch?v=' + vid,
        title:    titleMatch ? titleMatch[1].replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>') : 'Untitled',
        pubDate:  pubMatch ? pubMatch[1] : '',
        thumbnail: thumbMatch ? thumbMatch[1] : thumbUrl(vid)
      });
    }
  }
  return items;
}

/* =====================================================================
   FETCH FEED — primary rss2json, fallback allorigins XML parse
   ===================================================================== */
function fetchFeed(feedUrl, onSuccess, onError) {
  var api = PRIMARY_PROXY + encodeURIComponent(feedUrl);
  fetch(api)
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.status === 'ok' && d.items && d.items.length > 0) {
        var items = d.items.filter(function(i) { return i.link && getVid(i.link); });
        if (items.length > 0) { onSuccess(items); return; }
      }
      // Fallback: allorigins raw XML
      throw new Error('primary empty');
    })
    .catch(function() {
      var fb = FALLBACK_PROXY + encodeURIComponent(feedUrl);
      fetch(fb)
        .then(function(r) { return r.json(); })
        .then(function(d) {
          var xml = d.contents || '';
          var items = parseXMLItems(xml);
          if (items.length > 0) { onSuccess(items); }
          else { onError('No videos found'); }
        })
        .catch(function(e) { onError(e.message || 'Network error'); });
    });
}

/* =====================================================================
   WATCH LATER  (localStorage)
   ===================================================================== */
var _wl = JSON.parse(localStorage.getItem('cv1a_wl') || '[]');

function saveWL() {
  localStorage.setItem('cv1a_wl', JSON.stringify(_wl));
  updateWLBadge();
}

function isInWL(vid) {
  return _wl.some(function(v){ return v.vid === vid; });
}

function addToWL(item) {
  if (!isInWL(item.vid)) {
    _wl.unshift(item);
    saveWL();
  }
}

function removeFromWL(vid) {
  _wl = _wl.filter(function(v){ return v.vid !== vid; });
  saveWL();
  renderWL();
}

function updateWLBadge() {
  var n = _wl.length;
  var badge = document.getElementById('wl-count');
  var bannerCount = document.getElementById('wl-banner-count');
  if (n > 0) {
    badge.textContent = n;
    badge.style.display = 'inline-block';
  } else {
    badge.style.display = 'none';
  }
  if (bannerCount) bannerCount.textContent = n + ' video' + (n !== 1 ? 's' : '');
}

function renderWL() {
  var el = document.getElementById('wl-list');
  updateWLBadge();
  if (_wl.length === 0) {
    el.innerHTML = '<div class="wl-empty"><span class="wl-empty-icon">🕐</span>No saved videos yet.<br>Tap 🕐 on any video to save it here.</div>';
    return;
  }
  var html = '';
  _wl.forEach(function(v) {
    html +=
      '<div class="wl-item" id="wli-' + v.vid + '">' +
        '<img class="wl-thumb" src="' + esc(thumbUrl(v.vid)) + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">' +
        '<div class="wl-info">' +
          '<div class="wl-title">' + esc(v.title) + '</div>' +
          '<div class="wl-meta">' + esc(v.feed || '') + (v.date ? ' · ' + esc(v.date) : '') + '</div>' +
        '</div>' +
        '<div class="wl-actions">' +
          '<button class="btn-wl-play" onclick="openPlayer(\'' + esc(v.vid) + '\',\'' + esc(v.title).replace(/'/g,"&#39;") + '\',\'' + esc(v.date) + '\',\'' + esc(v.feed||'') + '\',\'https://www.youtube.com/watch?v=' + esc(v.vid) + '\')">▶</button>' +
          '<button class="btn-wl-remove" onclick="removeFromWL(\'' + esc(v.vid) + '\')" title="Remove">✕</button>' +
        '</div>' +
      '</div>';
  });
  html += '<div class="wl-clear-row"><button class="btn-clear-all" onclick="clearAllWL()">✕ Clear All</button></div>';
  el.innerHTML = html;
}

function clearAllWL() {
  if (_wl.length === 0) return;
  if (confirm('Remove all ' + _wl.length + ' saved videos?')) {
    _wl = [];
    saveWL();
    renderWL();
  }
}

/* =====================================================================
   PLAYER
   ===================================================================== */
var _currentVid = null;
var _currentItem = null;

function openPlayer(vid, title, date, feed, link) {
  _currentVid = vid;
  _currentItem = {vid:vid, title:title, date:date, feed:feed};
  document.getElementById('player-iframe').src = embedUrl(vid);
  document.getElementById('p-title').textContent = title;
  document.getElementById('p-info-title').textContent = title;
  document.getElementById('p-info-meta').textContent = (feed||'') + (date ? ' · ' + date : '');
  document.getElementById('p-yt-link').href = link || ('https://www.youtube.com/watch?v=' + vid);
  updatePlayerWLBtn();
  document.getElementById('player-overlay').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function updatePlayerWLBtn() {
  var btn = document.getElementById('p-wl-btn');
  if (!_currentVid) return;
  if (isInWL(_currentVid)) {
    btn.textContent = '✓ Saved';
    btn.classList.add('saved');
  } else {
    btn.textContent = '+ Watch Later';
    btn.classList.remove('saved');
  }
}

function toggleWLFromPlayer() {
  if (!_currentVid || !_currentItem) return;
  if (isInWL(_currentVid)) {
    removeFromWL(_currentVid);
    renderWL();
  } else {
    addToWL(_currentItem);
    renderWL();
  }
  updatePlayerWLBtn();
  // also update the wl button in the feed list if visible
  var wlBtn = document.querySelector('.btn-wl[data-vid="' + _currentVid + '"]');
  if (wlBtn) {
    wlBtn.classList.toggle('saved', isInWL(_currentVid));
    wlBtn.title = isInWL(_currentVid) ? 'Remove from Watch Later' : 'Watch Later';
  }
}

function closePlayer() {
  document.getElementById('player-overlay').classList.remove('active');
  document.getElementById('player-iframe').src = '';
  document.body.style.overflow = '';
  _currentVid = null; _currentItem = null;
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closePlayer();
});

/* =====================================================================
   CHANNEL GROUP + FEED RENDERING
   ===================================================================== */
function buildGroup(ch, type, container) {
  var gid  = 'g-' + type + '-' + ch.name.replace(/\W+/g,'');
  var grid = 'f-' + type + '-' + ch.name.replace(/\W+/g,'');
  var isMarathi = ch.lang && ch.lang.toLowerCase().includes('marathi');
  var badgeCls  = type==='series' ? 'badge-s' : (isMarathi ? 'badge-mr' : 'badge-v');

  var div = document.createElement('div');
  div.className = 'channel-group';
  div.id = gid;
  div.innerHTML =
    '<div class="ch-header" onclick="toggleGroup(\'' + gid + '\',\'' + grid + '\',\'' + encodeURIComponent(ch.url) + '\',\'' + type + '\')">' +
      '<span class="ch-badge ' + badgeCls + '">' + esc(ch.lang) + '</span>' +
      '<span class="ch-name">' + esc(ch.name) + '</span>' +
      '<span class="ch-arrow">▼</span>' +
    '</div>' +
    '<div class="feed-grid" id="' + grid + '">' +
      '<div class="loading-row"><span class="spin">⟳</span> Loading…</div>' +
    '</div>';
  container.appendChild(div);
}

function toggleGroup(gid, gridId, encUrl, type) {
  var grp  = document.getElementById(gid);
  var grid = document.getElementById(gridId);
  if (grp.classList.contains('open')) {
    grp.classList.remove('open'); return;
  }
  grp.classList.add('open');
  if (loadedFeeds[gridId]) return;
  loadedFeeds[gridId] = true;

  fetchFeed(
    decodeURIComponent(encUrl),
    function(items) { renderItems(grid, items, 0, BATCH, ''); },
    function(err)   { grid.innerHTML = '<div class="error-row">⚠ ' + esc(err) + ' — try again later</div>'; }
  );
}

function renderItems(grid, items, start, count, feedTitle) {
  var end = Math.min(start + count, items.length);
  for (var i = start; i < end; i++) {
    var it   = items[i];
    var vid  = getVid(it.link);
    if (!vid) continue;
    var thumb = thumbUrl(vid);
    var title = it.title || 'Untitled';
    var date  = fmtDate(it.pubDate || it.isoDate || '');
    var link  = it.link;
    var feed  = feedTitle || it.author || '';
    var inWL  = isInWL(vid);

    // safe attrs for onclick
    var sa  = title.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    var sav = vid.replace(/'/g,"\\'");
    var sad = date.replace(/'/g,"\\'");
    var saf = feed.replace(/'/g,"\\'");
    var sal = link.replace(/'/g,"\\'");

    var div = document.createElement('div');
    div.className = 'feed-item';

    var thumbHtml = thumb
      ? '<img class="item-thumb" src="' + esc(thumb) + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">'
      : '<div class="thumb-placeholder">▶</div>';

    div.innerHTML =
      thumbHtml +
      '<div class="item-info">' +
        '<div class="item-title">' + esc(title) + '</div>' +
        '<div class="item-date">' + esc(date) + '</div>' +
      '</div>' +
      '<div class="item-actions">' +
        '<button class="btn-play" onclick="event.stopPropagation();openPlayer(\'' + sav + '\',\'' + sa + '\',\'' + sad + '\',\'' + saf + '\',\'' + sal + '\')">▶</button>' +
        '<button class="btn-wl' + (inWL ? ' saved' : '') + '" data-vid="' + esc(vid) + '" title="' + (inWL ? 'Remove from Watch Later' : 'Watch Later') + '" onclick="event.stopPropagation();toggleWL(this,\'' + sav + '\',\'' + sa + '\',\'' + sad + '\',\'' + saf + '\')">🕐</button>' +
      '</div>';

    div.addEventListener('click', function() {
      var el = this;
      var btn = el.querySelector('.btn-play');
      btn && btn.click();
    });

    grid.appendChild(div);
  }

  // Load more
  var old = grid.querySelector('.load-more-wrap');
  if (old) old.remove();
  if (end < items.length) {
    var wrap = document.createElement('div');
    wrap.className = 'load-more-wrap';
    var btn = document.createElement('button');
    btn.className = 'btn-load-more';
    btn.textContent = '▼ Show More (' + (items.length - end) + ' remaining)';
    btn.addEventListener('click', function() { renderItems(grid, items, end, BATCH, feedTitle); });
    wrap.appendChild(btn);
    grid.appendChild(wrap);
  }
}

function toggleWL(btn, vid, title, date, feed) {
  var item = {vid:vid, title:title, date:date, feed:feed};
  if (isInWL(vid)) {
    removeFromWL(vid);
    btn.classList.remove('saved');
    btn.title = 'Watch Later';
  } else {
    addToWL(item);
    btn.classList.add('saved');
    btn.title = 'Remove from Watch Later';
  }
  renderWL();
}

/* =====================================================================
   SERIES FETCH TOOL
   ===================================================================== */
function fetchSeries() {
  var input  = document.getElementById('series-input');
  var resEl  = document.getElementById('series-results');
  var url    = (input.value || '').trim();
  if (!url) { alert('Please paste a YouTube Playlist or Channel URL.'); return; }

  var rssUrl = '';
  var m;
  if ((m = url.match(/[?&]list=([^&#]+)/)))  rssUrl = 'https://www.youtube.com/feeds/videos.xml?playlist_id=' + m[1];
  else if ((m = url.match(/channel\/([A-Za-z0-9_-]+)/))) rssUrl = 'https://www.youtube.com/feeds/videos.xml?channel_id=' + m[1];
  else if ((m = url.match(/user\/([A-Za-z0-9_-]+)/)))    rssUrl = 'https://www.youtube.com/feeds/videos.xml?user=' + m[1];
  else { alert('Could not detect Playlist or Channel ID. Use a full playlist URL (list=…) or channel URL (/channel/UC…).'); return; }

  resEl.style.display = 'block';
  resEl.innerHTML = '<div class="loading-row"><span class="spin">⟳</span> Fetching…</div>';

  fetchFeed(
    rssUrl,
    function(items) {
      resEl.innerHTML = '<div style="font-size:11px;font-weight:900;color:var(--series-hl);padding:4px 0 10px;">📺 ' + items.length + ' videos found</div>';
      renderItems(resEl, items, 0, BATCH, 'Playlist');
    },
    function(err) {
      resEl.innerHTML = '<div class="error-row">⚠ ' + esc(err) + '</div>';
    }
  );
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });

}

  }

  var prompt = null;
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault(); prompt = e;
    document.getElementById('pwa-badge').style.display = 'flex';
  });
  window.triggerInstall = function() {
    if (prompt) {
      prompt.prompt();
      prompt.userChoice.then(function(){ prompt=null; document.getElementById('pwa-badge').style.display='none'; });
    }
  };
  window.addEventListener('appinstalled', function(){ document.getElementById('pwa-badge').style.display='none'; });
})();
</script>
</body>
</html>
